name: One-off cleanup

on:
  workflow_dispatch:

jobs:
  delete-orphan-tags:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete leftover vitasdk/vitasdk:nightly-softfp* tags
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          token=$(curl -fsSL -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"$DOCKER_USERNAME\", \"password\": \"$DOCKER_PASSWORD\"}" \
            https://hub.docker.com/v2/users/login/ | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          for tag in \
            nightly-softfp \
            nightly-softfp-minimal \
            nightly-softfp-non-root \
            nightly-softfp-minimal-non-root \
            nightly-softfp-20260829 \
            nightly-softfp-minimal-20260829 \
            nightly-softfp-non-root-20260829 \
            nightly-softfp-minimal-non-root-20260829 \
          ; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: JWT $token" \
              "https://hub.docker.com/v2/repositories/vitasdk/vitasdk/tags/$tag/")
            echo "::notice::$tag -> $code"
          done
